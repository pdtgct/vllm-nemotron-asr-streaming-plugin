\* CaptureLifecycle.cfg: the capture lifecycle on the hooks; see the header
\* of CaptureLifecycle.tla for what each invariant and property means.
CONSTANTS
    N = 3
    MaxSteps = 2
    MaxMem = 2

SPECIFICATION Spec

CHECK_DEADLOCK TRUE

INVARIANT
    TypeOK
    NoReplayOutsideStep
    NoStepReplayOverProfilingPools
    NothingProfilingAfterClear
    LayoutReadOnlyInCapture
    PoolAccessBlockCountUnderBudget
    AtMostOneServingCapture
    AttemptedOnlyAfterEntryChecks
    EntryChecksExclusive
    UnprofiledServingCapture
    OverrunFailsStartup
    NothingLeftByFailedCall
    NothingAfterShutdown
    FailureIsReported
    CallReturnsSynchronized
    SegmentsOutliveCells
    NothingOutsideCaptures
    ServingInventoryComplete
    VerifiedBeforeServing

PROPERTY
    StartupSettles
    FailedWorkerShutsDown
    LatchIsStable
    RecaptureRefusalChangesNothing
