\* SplitStep.cfg: scheduled steps, the split step, reservations and the
\* latch; see the header of SplitStep.tla for what each invariant and
\* property means.
CONSTANTS
    N = 2
    Pmax = 3
    MaxSteps = 4

SPECIFICATION Spec

CHECK_DEADLOCK TRUE

INVARIANT
    TypeOK
    ReservationDisposition
    FirstLaunchNeverFallsBack
    LatchStopsRowSteps
    UnlatchedBypassCompletes
    StepReplayOnlyAfterVerification
    FallbackCountedOnce
    PreLaunchFailureContained
    WorkerFatalFailuresLatch
    ExactCellsReplayed
    AbortDoesNotCancel

PROPERTY
    FailedWorkerShutsDown
    LatchIsStable
    DelayedFaultContained
