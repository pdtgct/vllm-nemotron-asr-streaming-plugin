[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-nemotron-asr-streaming"
version = "0.1.0b1"
description = "Out-of-tree plugin for cache-aware streaming Nemotron ASR on vLLM core (RFC 1 + RFC 2 build)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Pete Tanski"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

# The two direct references pin the counterpart frontend release (SESS-FAC-007):
# vllm-riva-frontend and its seam conformance suite, vllm-riva-frontend-dev (the
# repository's dev/ subdirectory), both at one revision of the frontend
# repository. That revision becomes the release tag when the pair is released.
# A dependency group stays out of the built package metadata.
[dependency-groups]
test = [
    "pytest>=8",
    "vllm-riva-frontend @ git+https://github.com/pdtgct/vllm-riva-frontend.git@95d415b96b92ef20030a23afc56ac000ea675ba4",
    "vllm-riva-frontend-dev @ git+https://github.com/pdtgct/vllm-riva-frontend.git@95d415b96b92ef20030a23afc56ac000ea675ba4#subdirectory=dev",
]

[project.entry-points."vllm.general_plugins"]
# @spec REG-001
nemotron_asr_streaming = "vllm_nemotron_asr_streaming:register"

[project.entry-points."vllm_riva_frontend.session_factories"]
nemotron_asr_streaming = "vllm_nemotron_asr_streaming.session:create_session_factory"

[project.urls]
Repository = "https://github.com/pdtgct/vllm-nemotron-asr-streaming-plugin"
SourceModel = "https://github.com/pdtgct/vllm/tree/rfc1-5212-vllm/vllm/models/nemotron_asr"
Rfc1Tip = "https://github.com/pdtgct/vllm/tree/persistent-state-admission-20261112"

[tool.setuptools.packages.find]
include = ["vllm_nemotron_asr_streaming*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["vllm_nemotron_asr_streaming/nemotron_asr"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
